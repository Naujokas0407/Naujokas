<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>HLA Taurė · draftlive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#0b0d12; --card:#12151c; --card-2:#161a22; --line:#262b36; --line-2:#1c2029;
  --ink:#f2f4f8; --ink-2:#d3d8e2; --muted:#8b93a5; --faint:#5f6779;
  --gold:#f2c14e; --gold-2:#ffe08a; --gold-d:#b8860b; --gold-bg:rgba(242,193,78,.10);
  --win:#4cd07d; --loss:#ff6b5e; --cap:#ff7a1a;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(60rem 28rem at 50% -8%,rgba(242,193,78,.16),transparent 60%)}
a{color:inherit}
.top{border-bottom:1px solid var(--line);padding-inline:16px;background:rgba(11,13,18,.85);position:sticky;top:0;z-index:5;backdrop-filter:blur(8px)}
.top-in{max-width:1080px;margin:0 auto;height:54px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.back{color:var(--muted);text-decoration:none;font-size:14px}
.back:hover{color:var(--ink)}
.tl{font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
main{position:relative;max-width:1080px;margin:0 auto;padding:28px 16px 64px;display:flex;flex-direction:column;gap:22px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding-top:6px}
.trophy{width:132px;height:132px;filter:drop-shadow(0 14px 34px rgba(242,193,78,.35))}
.ht{font-size:38px;font-weight:800;letter-spacing:-.04em;line-height:1;margin:0;background:linear-gradient(180deg,var(--gold-2),var(--gold) 55%,var(--gold-d));-webkit-background-clip:text;background-clip:text;color:transparent}
.hs{color:var(--muted);margin:0;max-width:34rem}
.status{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink-2);border:1px solid rgba(242,193,78,.35);background:var(--gold-bg);border-radius:999px;padding:7px 14px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(242,193,78,.2)}
.status.live i{background:var(--cap);box-shadow:0 0 0 4px rgba(255,122,26,.22)}
.tabs{display:flex;gap:4px;justify-content:center;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:4px;align-self:center;flex-wrap:wrap}
.tabs button{font:600 14px inherit;font-family:inherit;color:var(--muted);background:transparent;border:0;border-radius:9px;padding:8px 14px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--gold-bg);color:var(--gold-2);box-shadow:inset 0 0 0 1px rgba(242,193,78,.35)}
.sub{font-size:13px;color:var(--muted);margin:4px 0 -10px}
.note{font-size:13px;color:var(--ink-2);border:1px dashed rgba(242,193,78,.4);background:var(--gold-bg);border-radius:12px;padding:10px 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.gh{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px}
.gl{display:flex;align-items:center;gap:10px;font-weight:700}
.gbadge{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;color:#1a1204;background:linear-gradient(135deg,var(--gold-2),var(--gold) 60%,var(--gold-d))}
.gr{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 10px;text-align:right;font-size:13.5px;white-space:nowrap}
th{font-size:11.5px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--line-2)}
td{border-top:1px solid var(--line-2)}
th.l,td.l{text-align:left}
td.nm{white-space:normal;color:var(--ink)}
td.rk{color:var(--faint);width:22px}
tr.q1 td.rk{color:var(--gold)}
.dv{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;border-radius:5px;padding:1px 5px;margin-right:6px;vertical-align:1px;border:1px solid var(--line);color:var(--muted)}
.dv.d1{color:#1a1204;background:var(--gold);border-color:var(--gold)}
.dv.d2{color:#e3e7ef;border-color:#8b93a5}
.dv.d3{color:#e3a36b;border-color:#8a5a33}
.dv.d4{color:var(--muted)}
td.pts{font-weight:700;color:var(--ink)}
.ms{border-top:1px solid var(--line);padding:6px 12px 10px}
.ms summary{cursor:pointer;font-size:12.5px;color:var(--muted);padding:6px 2px;list-style:none}
.ms summary::-webkit-details-marker{display:none}
.ms summary::before{content:"▸ ";color:var(--faint)}
.ms[open] summary::before{content:"▾ "}
.m{display:grid;grid-template-columns:34px 1fr auto 1fr;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);padding:3px 0}
.m .a{text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m .b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m .s{font-weight:600;color:var(--ink-2);white-space:nowrap}
.m .w{color:var(--win)}
.m.cur .s{color:var(--cap)}
.stage{display:flex;flex-direction:column;gap:10px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:6px}
.sh h3{margin:0;font-size:17px;letter-spacing:-.01em}
.sh span{font-size:12.5px;color:var(--muted)}
.ties{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.tie{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.tie.fin{border-color:rgba(242,193,78,.55);background:linear-gradient(180deg,rgba(242,193,78,.10),var(--card) 70%)}
.tr{display:grid;grid-template-columns:30px 1fr auto auto auto;gap:8px;align-items:center;font-size:13.5px}
.tr .sd{font-size:11px;font-weight:700;color:var(--gold)}
.tr .tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.tr .lg{font-size:12px;color:var(--muted);min-width:42px;text-align:right}
.tr .ag{font-weight:800;min-width:52px;text-align:right}
.tr.won .tn{color:var(--ink);font-weight:700}
.tr.won .ag{color:var(--win)}
.tr.lost .tn,.tr.lost .ag{color:var(--faint)}
.tr.tbd .tn{color:var(--faint);font-style:italic}
.tf{font-size:11.5px;color:var(--faint);display:flex;justify-content:space-between;gap:8px}
.half{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin:4px 0 -2px}
.champ{display:flex;flex-direction:column;align-items:center;gap:6px;border:1px solid rgba(242,193,78,.55);border-radius:16px;padding:18px;background:linear-gradient(180deg,rgba(242,193,78,.16),var(--card))}
.champ b{font-size:22px;color:var(--gold-2)}
/* atkrintamųjų medis */
.treew{width:min(calc(100vw - 32px),1640px);position:relative;left:50%;transform:translateX(-50%);overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:14px;background:var(--card);padding:14px 4px}
.treehint{display:none;font-size:12px;color:var(--faint);text-align:center;margin:-4px 0 0}
@media (max-width:1100px){.treehint{display:block}}
.tree{display:flex;align-items:stretch;height:600px;width:max-content;margin:0 auto}
.tcol{display:flex;flex-direction:column;width:140px;margin:0 13px}
.tcol.fc{width:164px}
.tcol.fc .tbody{position:relative;justify-content:center}
.thd{height:22px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);text-align:center;flex:none}
.tcol.fc .thd{color:var(--gold)}
.tbody{flex:1;display:flex;flex-direction:column}
.bp{flex:1;display:flex;flex-direction:column;justify-content:space-around;position:relative}
.bm{position:relative;border:1px solid var(--line);border-radius:9px;background:var(--card-2);font-size:12px;overflow:visible}
.bm.live{border-color:var(--cap)}
.bm.fin{border-color:rgba(242,193,78,.7);box-shadow:0 0 0 3px rgba(242,193,78,.12);background:linear-gradient(180deg,rgba(242,193,78,.14),var(--card-2))}
.brr{display:grid;grid-template-columns:auto 1fr auto;gap:5px;align-items:center;padding:4px 7px;height:24px}
.brr+.brr{border-top:1px solid var(--line-2)}
.brr .bs{font-size:9.5px;font-weight:800;color:var(--gold);min-width:16px}
.brr .bn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.brr .bn.tbd{color:var(--faint)}
.brr b{font-weight:700;color:var(--muted);font-size:11.5px}
.brr.won .bn{color:var(--ink);font-weight:700}.brr.won b{color:var(--win)}
.brr.lost .bn,.brr.lost b{color:var(--faint)}
.tree .L .bp:not(.one)::after{content:"";position:absolute;right:-13px;top:25%;bottom:25%;width:13px;border:1px solid #3a4150;border-left:0;border-radius:0 6px 6px 0}
.tree .R .bp:not(.one)::after{content:"";position:absolute;left:-13px;top:25%;bottom:25%;width:13px;border:1px solid #3a4150;border-right:0;border-radius:6px 0 0 6px}
.tree .L:not(.c0) .bm::before{content:"";position:absolute;left:-14px;top:50%;width:13px;border-top:1px solid #3a4150}
.tree .R:not(.c0) .bm::before{content:"";position:absolute;right:-14px;top:50%;width:13px;border-top:1px solid #3a4150}
.tree .L.c3 .bm::after,.tree .fc .bm::before{content:"";position:absolute;right:-14px;top:50%;width:13px;border-top:1px solid rgba(242,193,78,.6)}
.tree .R.c3 .bm::after,.tree .fc .bm::after{content:"";position:absolute;left:-14px;top:50%;width:13px;border-top:1px solid rgba(242,193,78,.6)}
.tree .fc .bm::before{right:auto;left:-14px}.tree .fc .bm::after{left:auto;right:-14px}
.ftrophy{position:absolute;left:0;right:0;bottom:calc(50% + 40px);display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.ftrophy b{font-size:13px;color:var(--gold-2)}
.ftrophy span{font-size:11px;color:var(--faint)}
.pairs-h{margin-top:8px}
.rps{display:flex;flex-direction:column;gap:12px}
.rp{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:14px 16px}
.rp h3{margin:0 0 8px;font-size:15.5px;color:var(--gold-2)}
.rp p{margin:0 0 6px;font-size:14px;line-height:1.6;color:var(--ink-2)}
.rp p:last-child{margin-bottom:0}
.rp b{color:var(--ink)}
.aw{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.awt{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:12px 14px}
.awt .h{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:4px}
.awt .v{font-size:15px;color:var(--ink-2)}.awt .v b{color:var(--gold-2);margin-left:4px}
.awt .s{font-size:12px;color:var(--muted);margin-top:2px}
.x{overflow-x:auto}
#stats{display:flex;flex-direction:column;gap:14px}
@media (max-width:480px){.aw{grid-template-columns:1fr 1fr;gap:8px}}
.dts{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;align-items:start}
@media (max-width:560px){.dts{grid-template-columns:1fr}}
.dt{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.dt-h{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:center}
.dt-h .h{font-weight:700}
.dt-nav{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink-2);font-size:18px;cursor:pointer}
.dt-r{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line-2)}
.dt-r.sm{padding:4px 0;font-size:13.5px}
.dt-p{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:11.5px;font-weight:800;background:var(--gold-bg);color:var(--gold)}
.dt-n{min-width:0;font-size:14px;color:var(--ink-2)}
.dt-o{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:2px}
.own{white-space:nowrap}
.dt-v{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.dt-v b{font-size:15px}
.stars{color:#f2c14e;font-size:12px;letter-spacing:1px}.stars i{font-style:normal;color:#3a4150}
.dt-f{font-size:11.5px;color:var(--faint);border-top:1px solid var(--line-2);padding-top:6px}
.pm{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.pm-c{position:relative;width:100%;max-width:520px;max-height:90vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
#pmBody{display:flex;flex-direction:column;gap:12px}
.pm-x{position:absolute;top:10px;right:10px;border:0;background:var(--line);color:var(--ink);width:32px;height:32px;border-radius:8px;cursor:pointer}
.pm-h{padding-right:36px}.pm-n{font-size:19px;font-weight:700}
.pm-s{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pm-s div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.pm-s b{font-size:18px;color:var(--gold-2)}
.cuplink{display:block;text-align:center;padding:10px;border:1px solid rgba(242,193,78,.45);border-radius:10px;color:var(--gold-2);text-decoration:none;font-weight:600}
[data-team]{cursor:pointer}
[data-team]:hover{text-decoration:underline;text-decoration-color:var(--faint)}
.rules{display:flex;flex-direction:column;gap:12px}
.rules .card{padding:14px 16px}
.rules h3{margin:0 0 6px;font-size:15px;color:var(--gold-2)}
.rules p,.rules li{margin:0;font-size:14px;color:var(--ink-2);line-height:1.6}
.rules ul{margin:0;padding-left:18px}
.sched{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:14px}
.sched span:nth-child(odd){color:var(--ink-2)}
.sched span:nth-child(even){color:var(--muted);text-align:right}
.sched .on{color:var(--gold-2)!important;font-weight:700}
.foot{font-size:12px;color:var(--faint);text-align:center}
.gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding-inline:16px}
.gate form{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.gate h2{margin:0;font-size:20px;letter-spacing:-.02em}
.gate p{margin:0;color:var(--muted);font-size:13.5px}
.gate input{width:100%;font-family:inherit;font-weight:500;font-size:16px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-align:center}
@media (max-width:820px){input,select,textarea{font-size:16px !important}}
.gate input:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.gate button{width:100%;font:600 15px inherit;font-family:inherit;padding:12px;border:0;border-radius:10px;background:var(--gold);color:#1a1204;cursor:pointer}
.gate .gerr{color:var(--loss);font-size:13px;min-height:18px}
.gate a{color:var(--muted);font-size:13px;text-decoration:none}
@media (max-width:480px){.ht{font-size:31px}.trophy{width:108px;height:108px}.grid,.ties{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="gate" id="gate" hidden>
  <form id="gateForm" autocomplete="off">
    <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><use href="#cupIcon" width="64" height="64"/></svg>
    <h2>HLA Taurė</h2>
    <p>Įveskite taurės slaptažodį</p>
    <input id="gatePass" type="password" placeholder="Slaptažodis" aria-label="Slaptažodis">
    <button type="submit">Įeiti</button>
    <div class="gerr" id="gateErr" role="alert"></div>
    <a href="./">← Visos lygos</a>
  </form>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe9a8"/><stop offset=".45" stop-color="#f2c14e"/><stop offset="1" stop-color="#a8760a"/></linearGradient>
    <linearGradient id="gGold2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2c14e"/><stop offset="1" stop-color="#8a5f08"/></linearGradient>
    <symbol id="cupIcon" viewBox="0 0 64 64">
      <path d="M18 8h28v14c0 9-6 16-14 16s-14-7-14-16z" fill="url(#gGold)"/>
      <path d="M18 12H9v4c0 7 5 12 11 13M46 12h9v4c0 7-5 12-11 13" fill="none" stroke="url(#gGold2)" stroke-width="3.5" stroke-linecap="round"/>
      <rect x="29" y="37" width="6" height="9" fill="url(#gGold2)"/>
      <rect x="20" y="46" width="24" height="5" rx="2" fill="url(#gGold)"/>
      <rect x="16" y="51" width="32" height="7" rx="2.5" fill="url(#gGold2)"/>
      <path d="M26 14c0 6 2 11 5 13" fill="none" stroke="#fff6d6" stroke-opacity=".7" stroke-width="2.5" stroke-linecap="round"/>
    </symbol>
  </defs>
</svg>
<header class="top"><div class="top-in">
  <a class="back" href="./">← Visos lygos</a>
  <span class="tl"><svg width="22" height="22" viewBox="0 0 64 64" aria-hidden="true"><use href="#cupIcon" width="64" height="64"/></svg>HLA Taurė</span>
  <span></span>
</div></header>
<main>
  <section class="hero">
    <svg class="trophy" viewBox="0 0 120 120" aria-hidden="true">
      <circle cx="60" cy="60" r="56" fill="#12151c" stroke="#3a3220" stroke-width="2"/>
      <use href="#cupIcon" x="22" y="20" width="76" height="76"/>
      <path d="M92 26l1.8 4 4 1.8-4 1.8-1.8 4-1.8-4-4-1.8 4-1.8z" fill="#ffe9a8"/>
      <path d="M26 40l1.2 2.6 2.6 1.2-2.6 1.2-1.2 2.6-1.2-2.6-2.6-1.2 2.6-1.2z" fill="#ffe9a8" opacity=".8"/>
    </svg>
    <h1 class="ht">HLA Taurė</h1>
    <p class="hs">32 komandos iš keturių divizionų. Grupės, atkrintamosios ir vienas čempionas.</p>
    <span class="status" id="status"><i></i><span>Kraunama…</span></span>
  </section>
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-t="groups">Grupės</button>
    <button role="tab" aria-selected="false" data-t="ko">Atkrintamosios</button>
    <button role="tab" aria-selected="false" data-t="rep">Reporteris</button>
    <button role="tab" aria-selected="false" data-t="stats">Statistika</button>
    <button role="tab" aria-selected="false" data-t="rules">Taisyklės</button>
  </div>
  <section id="groups"></section>
  <section id="ko" hidden></section>
  <section id="rep" hidden></section>
  <section id="stats" hidden></section>
  <section id="rules" class="rules" hidden></section>
  <div class="pm" id="pm" hidden><div class="pm-c" role="dialog" aria-modal="true" aria-label="Komandos kortelė"><button type="button" class="pm-x" aria-label="Uždaryti">✕</button><div id="pmBody"></div></div></div>
  <p class="foot">Rezultatai skaičiuojami automatiškai iš lygų duomenų (fantasy taškai iš BasketNews Fantasy).</p>
</main>
<script>
const LG = [{ slug: "hla1", div: 1 }, { slug: "hla2", div: 2 }, { slug: "hla3", div: 3 }, { slug: "hla4", div: 4 }];
const START = 8, SEED_AFTER = 7, GROUP_END = 21, GROUP_ROUNDS = Array.from({ length: 14 }, (_, i) => 8 + i);
const STAGES = [{ key: "r32", name: "1/16 finalo", gen: "1/16 finalo", r: [22, 23] }, { key: "r16", name: "1/8 finalo", gen: "1/8 finalo", r: [24, 25] }, { key: "qf", name: "Ketvirtfinalis", gen: "Ketvirtfinalio", r: [26, 27] }, { key: "sf", name: "Pusfinalis", gen: "Pusfinalio", r: [28, 29] }, { key: "f", name: "Finalas", r: [30, 31] }];
const GN = "ABCD".split("");
// grupės vidaus tvarkaraštis: 8 komandos, du ratai (ratinis metodas), 7 + 7 turai
const GSCHED = (() => { const n = 8, arr = [...Array(n).keys()], leg = [];
  for (let r = 0; r < n - 1; r++) { const pr = []; for (let i = 0; i < n / 2; i++) pr.push(r % 2 ? [arr[n - 1 - i], arr[i]] : [arr[i], arr[n - 1 - i]]); leg.push(pr); arr.splice(1, 0, arr.pop()); }
  return [...leg, ...leg.map(pr => pr.map(([a, b]) => [b, a]))]; })();
// 1/16 finalo tinklelis: A–B ir C–D grupių poros, 1 vieta prieš 8, 2 – prieš 7 ir t. t.
const BRACKET = ["A1-B8", "C4-D5", "B3-A6", "D2-C7", "C1-D8", "A4-B5", "D3-C6", "B2-A7", "B1-A8", "D4-C5", "A3-B6", "C2-D7", "D1-C8", "B4-A5", "C3-D6", "A2-B7"];

const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const num = n => n == null ? "–" : String(Math.round(n * 100) / 100).replace(".", ",");
let DATA = null, CUR = 0, RSTATE = "scheduled";

async function load() {
  const ds = await Promise.all(LG.map(L => fetch("data/" + L.slug + ".json?t=" + Date.now(), { cache: "no-store" }).then(r => r.ok ? r.json() : null).catch(() => null)));
  if (ds.some(d => !d)) { document.querySelector("#status span").textContent = "Nepavyko įkelti duomenų"; return; }
  DATA = ds.map((d, i) => ({ ...LG[i], d }));
  CUR = Math.max(...ds.map(d => d.round));
  const g = ds[0].games || [];
  RSTATE = g.length && g.every(x => x.status === "final") ? "final" : g.some(x => x.status !== "scheduled") ? "live" : "scheduled";
  render();
}

// komandos taškai konkrečiame Eurolygos ture (null – dar nežaista)
function scoreOf(L, title, r) {
  const d = L.d;
  if (r > d.round) return null;
  if (d.format === "h2h") {
    if (r < d.round) { const m = (d.results || []).find(x => x.r === r && (x.a === title || x.b === title)); return m ? (m.a === title ? m.as : m.bs) : null; }
    if (RSTATE === "scheduled") return null;
    const t = d.teams.find(x => x.title === title); return t ? (t.official ?? t.total) : null;
  }
  if (r === d.round) { if (RSTATE === "scheduled") return null; const t = d.teams.find(x => x.title === title); return t ? t.total : null; }
  const h = (d.history || {})[r]; return h && h[title] != null ? h[title] : null;
}
const isFinal = r => r < CUR || (r === CUR && RSTATE === "final");

// lygos lentelė po N turo
function standings(L, upto) {
  const d = L.d, rows = d.teams.map(t => ({ title: t.title, w: 0, pts: 0 }));
  const by = Object.fromEntries(rows.map(x => [x.title, x]));
  for (let r = 1; r <= upto; r++) {
    if (d.format === "h2h") {
      (d.results || []).filter(m => m.r === r).forEach(m => { const A = by[m.a], B = by[m.b]; if (!A || !B) return; A.pts += m.as; B.pts += m.bs; if (m.as > m.bs) A.w++; else if (m.bs > m.as) B.w++; else { A.w += .5; B.w += .5; } });
    } else rows.forEach(x => { const v = scoreOf(L, x.title, r); if (v != null) x.pts += v; });
  }
  return rows.sort((a, b) => d.format === "h2h" ? (b.w - a.w) || (b.pts - a.pts) : b.pts - a.pts);
}

function buildGroups() {
  const lastDone = Math.min(SEED_AFTER, isFinal(CUR) ? CUR : CUR - 1);
  const st = DATA.map(L => standings(L, lastDone));
  // po 2 komandas iš kiekvieno diviziono: HLA1 ir HLA3 – A: 1 ir 8 vietos, B: 2 ir 7, C: 3 ir 6, D: 4 ir 5; HLA2 ir HLA4 – atvirkščiai (A: 4 ir 5 ... D: 1 ir 8)
  const groups = GN.map((n, gi) => ({ name: n, teams: DATA.flatMap((L, li) => { const ps = li % 2 === 0 ? [gi, 7 - gi] : [3 - gi, 4 + gi]; return ps.map(pos => { const row = st[li][pos]; return row ? { title: row.title, L, div: L.div, seedPos: pos + 1 } : null; }); }).filter(Boolean) }));
  return { groups, prelim: lastDone < SEED_AFTER, basedOn: lastDone };
}

function groupTable(G) {
  const t = G.teams.map((x, i) => ({ ...x, i, w: 0, l: 0, dr: 0, pf: 0, pa: 0, gp: 0 }));
  const matches = [];
  GSCHED.forEach((pairs, k) => { const r = GROUP_ROUNDS[k];
    pairs.forEach(([a, b]) => { const A = t[a], B = t[b]; if (!A || !B) return;
      const sa = scoreOf(A.L, A.title, r), sb = scoreOf(B.L, B.title, r);
      matches.push({ r, A, B, sa, sb, fin: isFinal(r) });
      if (sa != null && sb != null && isFinal(r)) { A.gp++; B.gp++; A.pf += sa; A.pa += sb; B.pf += sb; B.pa += sa; if (sa > sb) { A.w++; B.l++; } else if (sb > sa) { B.w++; A.l++; } else { A.dr++; B.dr++; } }
    }); });
  t.sort((a, b) => ((b.w + b.dr / 2) - (a.w + a.dr / 2)) || (b.pf - a.pf) || (a.i - b.i));
  t.forEach((x, k) => x.place = k + 1);
  return { rows: t, matches };
}

function render() {
  const { groups, prelim, basedOn } = buildGroups();
  const tables = groups.map(G => ({ G, ...groupTable(G) }));
  // būsena
  const s = document.getElementById("status"), live = RSTATE === "live";
  let txt;
  if (CUR < START) txt = `Taurė prasidės ${START} ture · dabar ${CUR} turas`;
  else if (CUR <= GROUP_END) txt = `Grupių etapas · ${CUR} turas (${CUR - 7}/14)${live ? " · vyksta" : ""}`;
  else { const stg = STAGES.find(x => x.r.includes(CUR)); txt = stg ? `${stg.name} · ${stg.r.indexOf(CUR) + 1}-osios rungtynės${live ? " · vyksta" : ""}` : "Taurė baigta"; }
  s.className = "status" + (live && CUR >= START ? " live" : ""); s.querySelector("span").textContent = txt;
  renderGroups(tables, prelim, basedOn);
  TABLES = tables;
  renderKO(tables);
  try { renderReporter(); } catch (e) { console.error(e); }
  try { renderStats(); } catch (e) { console.error(e); }
  renderRules();
}

function divChip(d) { return `<span class="dv d${d}">D${d}</span>`; }

function mline(m) { const cur = m.r === CUR && !m.fin && m.sa != null; const aw = m.fin && m.sa > m.sb, bw = m.fin && m.sb > m.sa;
  return `<div class="m ${cur ? "cur" : ""}"><span>${m.r} t.</span><span class="a ${aw ? "w" : ""}" data-team="${esc(m.A.title)}">${esc(m.A.title)}</span><span class="s">${m.sa == null ? "–" : num(m.sa) + " : " + num(m.sb)}</span><span class="b ${bw ? "w" : ""}" data-team="${esc(m.B.title)}">${esc(m.B.title)}</span></div>`; }
function renderGroups(tables, prelim, basedOn) {
  const el = document.getElementById("groups");
  let html = "";
  if (prelim) html += `<p class="note">Grupės dar preliminarios: sudarytos pagal vietas lygose po ${basedOn || 0} turo. Galutinės grupės bus aiškios po ${SEED_AFTER} turo, o taurė prasidės ${START} ture.</p>`;
  html += `<div class="grid">` + tables.map(({ G, rows, matches }) => {
    const anyPlayed = rows.some(x => x.gp);
    return `<article class="card"><div class="gh"><span class="gl"><span class="gbadge">${G.name}</span>Grupė ${G.name}</span><span class="gr">${anyPlayed ? rows[0].gp + "/14 sužaista" : "8–21 turai"}</span></div>
      <table><thead><tr><th class="l">#</th><th class="l">Komanda</th><th>P</th><th>Pr</th><th>Taškai</th></tr></thead><tbody>` +
      (anyPlayed ? rows : [...rows].sort((a, b) => a.div - b.div)).map((x, k) => `<tr class="${anyPlayed && k === 0 ? "q1" : ""}"><td class="l rk">${anyPlayed ? x.place : "–"}</td><td class="l nm">${divChip(x.div)}<span data-team="${esc(x.title)}">${esc(x.title)}</span></td><td>${num(x.w + x.dr / 2)}</td><td>${x.l}</td><td class="pts">${num(x.pf)}</td></tr>`).join("") +
      `</tbody></table>
      ${(() => { const rr = matches.filter(m => m.r === CUR); return rr.length ? `<div class="ms"><div class="gr" style="padding:6px 2px">${CUR} turo rungtynės</div>${rr.map(mline).join("")}</div>` : ""; })()}
      <details class="ms"><summary>Visos rungtynės (14 turų)</summary>` +
      matches.map(m => { const cur = m.r === CUR && !m.fin && m.sa != null; const aw = m.fin && m.sa > m.sb, bw = m.fin && m.sb > m.sa;
        return `<div class="m ${cur ? "cur" : ""}"><span>${m.r} t.</span><span class="a ${aw ? "w" : ""}" data-team="${esc(m.A.title)}">${esc(m.A.title)}</span><span class="s">${m.sa == null ? "–" : num(m.sa) + " : " + num(m.sb)}</span><span class="b ${bw ? "w" : ""}" data-team="${esc(m.B.title)}">${esc(m.B.title)}</span></div>`; }).join("") +
      `</details></article>`;
  }).join("") + `</div>`;
  el.innerHTML = html;
}

// ---- atkrintamosios ----
function renderKO(tables) {
  const el = document.getElementById("ko");
  const groupsDone = isFinal(GROUP_END);
  const bySeed = {};
  tables.forEach(({ G, rows }) => rows.forEach(x => { bySeed[G.name + x.place] = x; }));
  const seedRank = x => x ? [x.place, -(x.pf || 0)] : [99, 0];
  const better = (a, b) => { const ra = seedRank(a), rb = seedRank(b); return ra[0] !== rb[0] ? ra[0] < rb[0] : ra[1] <= rb[1]; };
  const playTie = (a, b, stg) => {
    const legs = stg.r.map(r => ({ r, sa: a ? scoreOf(a.L, a.title, r) : null, sb: b ? scoreOf(b.L, b.title, r) : null, fin: isFinal(r) }));
    const ag = legs.reduce((s, l) => s + (l.sa ?? 0), 0), bg = legs.reduce((s, l) => s + (l.sb ?? 0), 0);
    const done = a && b && legs.every(l => l.fin && l.sa != null && l.sb != null);
    let win = null;
    if (done) win = ag > bg ? a : bg > ag ? b : (better(a, b) ? a : b);
    return { a, b, legs, ag, bg, done, win, started: legs.some(l => l.sa != null) };
  };
  let prev = BRACKET.map(p => { const [x, y] = p.split("-"); return { la: x, lb: y, a: groupsDone ? bySeed[x] : null, b: groupsDone ? bySeed[y] : null }; });
  const out = [];
  STAGES.forEach((stg, si) => {
    const ties = prev.map(t => ({ ...t, ...playTie(t.a, t.b, stg), stg }));
    out.push({ stg, ties });
    const next = [];
    for (let i = 0; i < ties.length; i += 2) next.push({ la: "NUG|" + stg.gen + " " + (i + 1) + " poros", lb: "NUG|" + stg.gen + " " + (i + 2) + " poros", a: ties[i].win, b: ties[i + 1] ? ties[i + 1].win : null });
    prev = next;
  });
  KO = out;
  const fin = out[out.length - 1].ties[0];
  let html = "";
  if (!groupsDone) html += `<p class="note">Poros paaiškės po grupių etapo (21 turo). Žemiau – tinklelis su grupių vietomis: tos pačios grupės 1-a ir 2-a vieta gali susitikti tik finale.</p>`;
  if (fin.win) html += `<div class="champ"><svg width="72" height="72" viewBox="0 0 64 64" aria-hidden="true"><use href="#cupIcon" width="64" height="64"/></svg><span class="gr">HLA Taurės čempionas</span><b>${esc(fin.win.title)}</b></div>`;
  html += treeHtml(out, fin);
  html += `<div class="sh pairs-h"><h3>Porų rezultatai</h3><span>abiejų rungtynių taškai ir suma</span></div>`;
  html += out.map(({ stg, ties }) => `<div class="stage"><div class="sh"><h3>${stg.name}</h3><span>${stg.r[0]}–${stg.r[1]} turai · laimi dviejų turų suma</span></div>` +
    (stg.key === "r32" ? `<div class="half">Viršutinė pusė</div>${tieGrid(ties.slice(0, 8), stg)}<div class="half">Apatinė pusė</div>${tieGrid(Object.assign(ties.slice(8), { off: 8 }), stg)}` : tieGrid(ties, stg)) + `</div>`).join("");
  el.innerHTML = html;
}
// ---- atkrintamųjų medis: viršutinė pusė kairėje, apatinė – dešinėje, finalas centre ----
function treeHtml(out, fin) {
  const short = ["1/16", "1/8", "1/4", "1/2"];
  const box = (t, isFin) => {
    const live = t.legs.some(l => l.r === CUR && !l.fin && l.sa != null);
    const row = (x, lab, agg) => {
      const cls = !t.done ? "" : (t.win === x ? "won" : "lost");
      const nug = lab.startsWith("NUG|");
      const tip = t.legs.map(l => `${l.r} t.: ${(x === t.a ? l.sa : l.sb) == null ? "–" : num(x === t.a ? l.sa : l.sb)}`).join(", ");
      return `<div class="brr ${cls}" title="${x ? esc(x.title) + " · " + tip : ""}"><span class="bs">${nug ? "" : esc(lab)}</span><span class="bn ${x ? "" : "tbd"}"${x ? ` data-team="${esc(x.title)}"` : ""}>${x ? esc(x.title) : nug ? "?" : "Gr. " + esc(lab[0]) + " " + esc(lab[1]) + " v."}</span><b>${t.started && x ? num(agg) : ""}</b></div>`;
    };
    return `<div class="bm ${isFin ? "fin" : ""} ${live ? "live" : ""}">${row(t.a, t.la, t.ag)}${row(t.b, t.lb, t.bg)}</div>`;
  };
  const col = (side, s) => {
    const ties = out[s].ties, n = ties.length / 2, part = side === "L" ? ties.slice(0, n) : ties.slice(n);
    let body = "";
    if (part.length === 1) body = `<div class="bp one">${box(part[0])}</div>`;
    else for (let i = 0; i < part.length; i += 2) body += `<div class="bp">${box(part[i])}${box(part[i + 1])}</div>`;
    return `<div class="tcol ${side} c${s}"><div class="thd">${short[s]}</div><div class="tbody">${body}</div></div>`;
  };
  const left = [0, 1, 2, 3].map(s => col("L", s)).join(""), right = [3, 2, 1, 0].map(s => col("R", s)).join("");
  const center = `<div class="tcol fc"><div class="thd">Finalas</div><div class="tbody"><div class="ftrophy"><svg width="54" height="54" viewBox="0 0 64 64" aria-hidden="true"><use href="#cupIcon" width="64" height="64"/></svg>${fin.win ? `<span>Čempionas</span><b>${esc(fin.win.title)}</b>` : `<span>30–31 turai</span>`}</div>${box(fin, true)}</div></div>`;
  return `<p class="treehint">← Medį galima slinkti į šonus →</p><div class="treew"><div class="tree">${left}${center}${right}</div></div>`;
}
function tieGrid(ties, stg) {
  return `<div class="ties">` + ties.map(t => {
    const row = (x, lab, leg, agg, side) => {
      const cls = !t.done ? (x ? "" : "tbd") : (t.win === x ? "won" : "lost");
      const nug = lab.startsWith("NUG|"), sd = nug ? "" : lab;
      return `<div class="tr ${cls}"><span class="sd">${esc(sd)}</span><span class="tn"${x ? ` data-team="${esc(x.title)}"` : ""}>${x ? divChip(x.div) + esc(x.title) : esc(nug ? lab.slice(4) + " nugalėtojas" : "Grupės " + lab[0] + " " + lab[1] + " vieta")}</span>${t.legs.map(l => `<span class="lg">${(side ? l.sb : l.sa) == null ? "–" : num(side ? l.sb : l.sa)}</span>`).join("")}<span class="ag">${t.started && x ? num(agg) : ""}</span></div>`;
    };
    const live = t.legs.some(l => l.r === CUR && !l.fin && l.sa != null);
    return `<div class="tie ${stg.key === "f" ? "fin" : ""}"><div class="tf"><span>${stg.key === "f" ? "Finalas" : (ties.indexOf(t) + 1 + (ties.off || 0)) + " pora"}</span><span></span></div>${row(t.a, t.la, 0, t.ag, false)}${row(t.b, t.lb, 1, t.bg, true)}<div class="tf"><span>${stg.r.map(r => r + " t.").join(" · ")}</span><span>${t.done ? "Baigta" : live ? "Vyksta" : t.started ? "Po 1-ųjų rungtynių" : ""}</span></div></div>`;
  }).join("") + `</div>`;
}


// ---- Taurės reporteris ir statistika ----
let KO = null, TABLES = null;
const hsh = s => { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; } return h; };
const pick = (arr, seed) => arr[hsh(seed) % arr.length];
const tn = t => `<b>${esc(t.title)}</b>`;
const lastFinal = () => isFinal(CUR) ? CUR : CUR - 1;
// visos taurės rungtynės (grupių ir atkrintamųjų)
function cupMatches() {
  const out = [];
  (TABLES || []).forEach(({ G, matches }) => matches.forEach(m => out.push({ ...m, stage: "Grupė " + G.name })));
  (KO || []).forEach(({ stg, ties }) => ties.forEach(t => t.a && t.b && t.legs.forEach(l => out.push({ r: l.r, A: t.a, B: t.b, sa: l.sa, sb: l.sb, fin: l.fin, stage: stg.name }))));
  return out;
}
// komandos sezono vidurkis per turą (visi baigti turai)
function seasonAvg() {
  const lf = lastFinal(), res = [];
  DATA.forEach(L => L.d.teams.forEach(t => { let s = 0, n = 0; for (let r = 1; r <= lf; r++) { const v = scoreOf(L, t.title, r); if (v != null) { s += v; n++; } } res.push({ title: t.title, L, div: L.div, avg: n ? s / n : 0, n }); }));
  return res.sort((a, b) => b.avg - a.avg);
}
function cupTeamStats() {
  const M = cupMatches().filter(m => m.fin && m.sa != null && m.sb != null), by = {};
  const T = x => by[x.title] = by[x.title] || { title: x.title, div: x.div, g: 0, w: 0, l: 0, d: 0, pf: 0, pa: 0, seq: [] };
  M.sort((a, b) => a.r - b.r).forEach(m => { const A = T(m.A), B = T(m.B);
    A.g++; B.g++; A.pf += m.sa; A.pa += m.sb; B.pf += m.sb; B.pa += m.sa;
    if (m.sa > m.sb) { A.w++; B.l++; A.seq.push("W"); B.seq.push("L"); } else if (m.sb > m.sa) { B.w++; A.l++; A.seq.push("L"); B.seq.push("W"); } else { A.d++; B.d++; A.seq.push("D"); B.seq.push("D"); } });
  Object.values(by).forEach(x => { let best = 0, cur = 0; x.seq.forEach(r => { cur = r === "W" ? cur + 1 : 0; best = Math.max(best, cur); }); x.streak = best; x.avg = x.g ? x.pf / x.g : 0; });
  return { M, teams: Object.values(by) };
}
const tileC = (h, v, s) => `<div class="awt"><div class="h">${h}</div><div class="v">${v}</div>${s ? `<div class="s">${s}</div>` : ""}</div>`;

function renderReporter() {
  const el = document.getElementById("rep"); if (!el) return;
  const arts = [], { M, teams } = cupTeamStats();
  const art = (h, ps) => `<article class="rp"><h3>${h}</h3>${ps.map(p => `<p>${p}</p>`).join("")}</article>`;
  if (CUR < START) {
    const av = seasonAvg(), left = START - CUR;
    const divAvg = [1, 2, 3, 4].map(d => { const x = av.filter(t => t.div === d); return { d, a: x.reduce((s, t) => s + t.avg, 0) / Math.max(1, x.length) }; }).sort((a, b) => b.a - a.a);
    const p = [];
    p.push(`Iki HLA Taurės starto liko <b>${left}</b> ${left === 1 ? "turas" : "turai"}. ${pick(["Trofėjus jau nupoliruotas, belieka išsiaiškinti, kas jį pakels.", "32 komandos, vienas trofėjus ir daug ambicijų.", "Lygose kovos tęsiasi, bet akys jau krypsta į taurę."], "pre" + CUR)}`);
    if (av[0] && av[0].n) p.push(`Pagal sezono vidurkį didžiausi favoritai – ${tn(av[0])} (${num(av[0].avg)} tšk. per turą), ${tn(av[1])} ir ${tn(av[2])}. ${av[0].div > 1 ? `Įdomu, kad lyderis žaidžia net ${av[0].div}-ajame divizione – taurėje divizionai nieko nereiškia.` : ""}`);
    if (divAvg[0]) p.push(`Stipriausias divizionas kol kas – <b>HLA ${divAvg[0].d}</b> (vidutiniškai ${num(divAvg[0].a)} tšk. per turą), silpniausias – HLA ${divAvg[3].d} (${num(divAvg[3].a)}). ${divAvg[0].d !== 1 ? "HLA 1 vardas dar turės pasiteisinti." : "Hierarchija kol kas veikia."}`);
    const dark = [...av].reverse().find(t => t.div >= 3 && av.indexOf(t) < 12);
    if (dark) p.push(`Tamsus arkliukas – ${tn(dark)} iš HLA ${dark.div}: ${num(dark.avg)} tšk. per turą, daugiau nei pusė aukštesnių divizionų komandų.`);
    arts.push(art("Taurės anonsas", p));
  }
  // grupių etapas
  if (CUR >= START && CUR <= GROUP_END + 0) {
    const gm = M.filter(m => GROUP_ROUNDS.includes(m.r));
    const rr = CUR > START && !cupMatches().some(m => m.r === CUR && m.sa != null) ? CUR - 1 : CUR;
    const rm = cupMatches().filter(m => m.r === rr && m.stage.startsWith("Grupė") && m.sa != null && m.sb != null);
    if (rm.length) {
      const done = isFinal(rr), p = [];
      const hi = rm.map(m => [{ t: m.A, v: m.sa, o: m.B }, { t: m.B, v: m.sb, o: m.A }]).flat().sort((a, b) => b.v - a.v)[0];
      const big = [...rm].sort((a, b) => Math.abs(b.sa - b.sb) - Math.abs(a.sa - a.sb))[0];
      const close = [...rm].sort((a, b) => Math.abs(a.sa - a.sb) - Math.abs(b.sa - b.sb))[0];
      const ups = rm.filter(m => (m.sa > m.sb && m.A.div > m.B.div + 1) || (m.sb > m.sa && m.B.div > m.A.div + 1));
      const rn = n => (n % 10 === 0 || (n % 100 > 10 && n % 100 < 20)) ? "rungtynių" : "rungtynės";
      p.push(`${done ? "Turas baigtas" : "Turas dar vyksta"}: ${rm.length} ${rn(rm.length)} keturiose grupėse. Daugiausia surinko ${tn(hi.t)} – <b>${num(hi.v)}</b> tšk. prieš ${esc(hi.o.title)}.`);
      const bw = big.sa > big.sb ? [big.A, big.B, big.sa, big.sb] : [big.B, big.A, big.sb, big.sa];
      p.push(`${pick(["Triuškinanti", "Didžiausia", "Įspūdingiausia"], rr + "b")} pergalė – ${tn(bw[0])} ${num(bw[2])} : ${num(bw[3])} prieš ${esc(bw[1].title)} (+${num(bw[2] - bw[3])}).`);
      if (Math.abs(close.sa - close.sb) < 8) p.push(`Nervų karas: ${esc(close.A.title)} ir ${esc(close.B.title)} skyrė vos ${num(Math.abs(close.sa - close.sb))} tšk.`);
      ups.slice(0, 2).forEach(m => { const [w, l] = m.sa > m.sb ? [m.A, m.B] : [m.B, m.A]; p.push(`${pick(["Dovydas įveikė Galijotą", "Sensacija", "Divizionai – tik skaičiai"], m.r + w.title)}: HLA ${w.div} atstovas ${tn(w)} nugalėjo HLA ${l.div} komandą ${esc(l.title)}.`); });
      arts.push(art(`${rr} turo apžvalga · grupių etapas`, p));
    }
    const p2 = [];
    (TABLES || []).forEach(({ G, rows }) => { if (!rows.some(x => x.gp)) return; const a = rows[0], b = rows[1];
      p2.push(`<b>Grupė ${G.name}:</b> pirmauja ${tn(a)} (${num(a.w + a.dr / 2)}–${a.l})${b && b.w + b.dr / 2 === a.w + a.dr / 2 ? `, bet ${esc(b.title)} turi tiek pat pergalių` : ""}. ${rows[rows.length - 1].w === 0 && rows[rows.length - 1].gp >= 2 ? `${esc(rows[rows.length - 1].title)} vis dar be pergalės.` : ""}`); });
    const unbeaten = teams.filter(x => x.l === 0 && x.g >= 3);
    if (unbeaten.length) p2.push(`Dar nepralaimėję: ${unbeaten.map(x => `<b>${esc(x.title)}</b>`).join(", ")}.`);
    if (p2.length) arts.push(art("Grupių kova", p2));
    // kito turo anonsas
    const nr = RSTATE !== "scheduled" ? CUR + 1 : CUR;
    if (nr <= GROUP_END && TABLES) {
      const nm = [];
      TABLES.forEach(({ G, rows, matches }) => matches.filter(m => m.r === nr).forEach(m => { const pa = rows.find(x => x.title === m.A.title), pb = rows.find(x => x.title === m.B.title); nm.push({ m, G, w: (pa && pb ? 20 - pa.place - pb.place : 0) + (m.A.div === m.B.div ? 3 : 0) }); }));
      const top = nm.sort((a, b) => b.w - a.w).slice(0, 3);
      if (top.length) arts.push(art(`${nr} turo anonsas`, [`Labiausiai laukiamos dvikovos: ` + top.map(x => `<b>${esc(x.m.A.title)}</b> – <b>${esc(x.m.B.title)}</b> (gr. ${x.G.name}${x.m.A.div === x.m.B.div ? `, HLA ${x.m.A.div} derbis` : ""})`).join("; ") + "."]));
    }
  }

    [...KO].reverse().forEach(({ stg, ties }) => {

      const p = [], done = ties.filter(t => t.done);
      if (done.length === ties.length) p.push(`${stg.name} baigtas. Toliau žengia: ${done.map(t => `<b>${esc(t.win.title)}</b>`).join(", ")}.`);
      else p.push(`${stg.name}: baigta ${done.length} iš ${ties.length} porų.`);
      const cl = done.filter(t => t.a && t.b).sort((x, y) => Math.abs(x.ag - x.bg) - Math.abs(y.ag - y.bg))[0];
      if (cl) p.push(`Įtempčiausia pora – ${esc(cl.a.title)} ir ${esc(cl.b.title)}: skirtumas vos ${num(Math.abs(cl.ag - cl.bg))} tšk. per dvejas rungtynes.`);
      done.forEach(t => { const l1 = t.legs[0]; if (!l1 || l1.sa == null) return; const w1 = l1.sa > l1.sb ? t.a : t.b; if (w1 !== t.win) p.push(`Sugrįžimas: ${tn(t.win)} pralaimėjo pirmąsias rungtynes, bet perrašė scenarijų ir eliminavo ${esc(w1.title)}.`); });
      done.filter(t => t.win.div > (t.win === t.a ? t.b : t.a).div + 1).slice(0, 2).forEach(t => p.push(`Sensacija: HLA ${t.win.div} komanda ${tn(t.win)} išmetė aukštesnio diviziono varžovą.`));
      const live = ties.filter(t => !t.done && t.started && t.a && t.b);
      if (live.length) { const x = live.sort((a, b) => Math.abs(a.ag - a.bg) - Math.abs(b.ag - b.bg))[0]; p.push(`Kol kas arčiausiai – ${esc(x.a.title)} ${num(x.ag)} : ${num(x.bg)} ${esc(x.b.title)}.`); }

  }
  el.innerHTML = arts.length ? `<div class="rps">${arts.join("")}</div>` : `<p class="note">Reporteris pradės rašyti, kai tik prasidės taurė.</p>`;
}

function renderStats() {
  const el = document.getElementById("stats"); if (!el) return;
  if (CUR < START) { el.innerHTML = `<p class="note">Taurės statistika prasidės kartu su taure (${START} turas).</p>`; return; }
  const { M, teams } = cupTeamStats(); let html = cupAwards() + playerAwards();
  if (M.length) {
    const all = M.flatMap(m => [{ t: m.A, v: m.sa, o: m.B, r: m.r }, { t: m.B, v: m.sb, o: m.A, r: m.r }]);
    const hi = all.sort((a, b) => b.v - a.v)[0], lo = [...all].sort((a, b) => a.v - b.v)[0];
    const big = [...M].sort((a, b) => Math.abs(b.sa - b.sb) - Math.abs(a.sa - a.sb))[0], bw = big.sa > big.sb ? [big.A, big.B, big.sa, big.sb] : [big.B, big.A, big.sb, big.sa];
    const st = [...teams].sort((a, b) => b.streak - a.streak)[0], most = [...teams].sort((a, b) => b.pf - a.pf)[0], avg = [...teams].filter(x => x.g >= 2).sort((a, b) => b.avg - a.avg)[0];

      tileC("Didžiausia pergalė", `${esc(bw[0].title)} <b>+${num(bw[2] - bw[3])}</b>`, `${num(bw[2])} : ${num(bw[3])} prieš ${esc(bw[1].title)}`) +
      (st && st.streak ? tileC("Ilgiausia pergalių serija", `${esc(st.title)} <b>${st.streak}</b>`, "pergalės iš eilės") : "") +
      tileC("Daugiausia taškų taurėje", `${esc(most.title)} <b>${num(most.pf)}</b>`, `${most.g} rungtynės`) +
      (avg ? tileC("Geriausias vidurkis", `${esc(avg.title)} <b>${num(avg.avg)}</b>`, "taškų per rungtynes") : "") +
      tileC("Mažiausiai per rungtynes", `${esc(lo.t.title)} <b>${num(lo.v)}</b>`, `${lo.r} turas`) + `</div>`;
    // divizionų kova
    const dv = [1, 2, 3, 4].map(d => ({ d, g: 0, w: 0, l: 0, pf: 0, vs: {} }));
    M.forEach(m => { if (m.A.div === m.B.div) return; const A = dv[m.A.div - 1], B = dv[m.B.div - 1]; A.g++; B.g++; A.pf += m.sa; B.pf += m.sb;
      const k = (x, y, w) => { x.vs[y] = x.vs[y] || [0, 0]; x.vs[y][w ? 0 : 1]++; };
      if (m.sa > m.sb) { A.w++; B.l++; k(A, m.B.div, 1); k(B, m.A.div, 0); } else if (m.sb > m.sa) { B.w++; A.l++; k(B, m.A.div, 1); k(A, m.B.div, 0); } });
    html += `<div class="sub">Divizionų kova (rungtynės tarp skirtingų divizionų)</div><div class="card"><div class="x"><table><thead><tr><th class="l">Divizionas</th><th>P–Pr</th><th>%</th>${[1, 2, 3, 4].map(d => `<th>prieš D${d}</th>`).join("")}<th>Vid.</th></tr></thead><tbody>` +
      [...dv].sort((a, b) => (b.w / Math.max(1, b.g)) - (a.w / Math.max(1, a.g))).map(x => `<tr><td class="l">${divChip(x.d)}HLA ${x.d}</td><td class="pts">${x.w}–${x.l}</td><td>${x.g ? Math.round(x.w / x.g * 100) : 0}</td>${[1, 2, 3, 4].map(d => `<td>${d === x.d ? "–" : x.vs[d] ? x.vs[d][0] + "–" + x.vs[d][1] : "0–0"}</td>`).join("")}<td>${x.g ? num(x.pf / x.g) : "–"}</td></tr>`).join("") + `</tbody></table></div></div>`;

  // sezono pajėgumas – visada

  el.innerHTML = html;
  bindStats(el);

function closeTeam() { document.getElementById("pm").hidden = true; document.body.style.overflow = ""; }
document.addEventListener("click", e => { const a = e.target.closest("[data-team]"); if (a) { e.preventDefault(); e.stopPropagation(); openTeam(a.dataset.team); return; } if (e.target.id === "pm" || e.target.closest(".pm-x")) closeTeam(); }, true);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeTeam(); });

function renderRules() {
  const el = document.getElementById("rules");
  const on = (a, b) => CUR >= a && CUR <= b ? "on" : "";
  el.innerHTML = `
  <div class="card"><h3>Dalyviai ir pradžia</h3><ul>
    <li>Dalyvauja visos 32 komandos iš HLA 1–4 (po 8 komandas).</li>
    <li>Taurė prasideda ${START} Eurolygos ture – kai visi savo lygose susitinka bent kartą.</li>
    <li>Taurės rungtynes laimi komanda, tą Eurolygos turą surinkusi daugiau fantasy taškų (tie patys taškai kaip lygoje, ir HLA 4).</li></ul></div>
  <div class="card"><h3>Grupių sudarymas (po ${SEED_AFTER} turo)</h3>
    <p>4 grupės po 8 komandas, kiekvienoje po dvi iš kiekvieno diviziono. Skirstoma pagal vietas lygose, kad grupės būtų lygios:</p>
    <ul><li>HLA 1 ir HLA 3: A – 1 ir 8 vietos, B – 2 ir 7, C – 3 ir 6, D – 4 ir 5</li><li>HLA 2 ir HLA 4: A – 4 ir 5 vietos, B – 3 ir 6, C – 2 ir 7, D – 1 ir 8</li></ul>
    <p>HLA 1–3 – pagal H2H lentelę, HLA 4 – pagal bendrą taškų sumą.</p></div>
  <div class="card"><h3>Grupių etapas (8–21 turai)</h3><ul>
    <li>Du ratai – kiekvienas su kiekvienu po 2 kartus (14 rungtynių).</li>

    <li>Niekas neiškrenta – visos 32 komandos patenka į atkrintamąsias. Vieta grupėje lemia varžovą.</li></ul></div>
  <div class="card"><h3>Atkrintamosios (22–31 turai)</h3><ul>
    <li>Grupės poromis A–B ir C–D: 1 vieta prieš kitos grupės 8, 2 – prieš 7, 3 – prieš 6, 4 – prieš 5.</li>
    <li>Kiekviena pora – 2 turai, toliau eina surinkusi daugiau taškų per abu turus.</li>
    <li>Lygi suma – praeina aukštesnę vietą grupėje užėmusi komanda.</li>
    <li>Tinklelis fiksuotas iš anksto – tos pačios grupės 1-a ir 2-a vieta gali susitikti tik finale.</li></ul></div>
  <div class="card"><h3>Tvarkaraštis</h3><div class="sched">
    <span class="${on(8, 21)}">Grupės</span><span class="${on(8, 21)}">8–21 turai</span>
    ${STAGES.map(s => `<span class="${on(s.r[0], s.r[1])}">${s.name}</span><span class="${on(s.r[0], s.r[1])}">${s.r[0]}–${s.r[1]} turai</span>`).join("")}
  </div></div>`;
}

document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-selected", String(x === b)));
  ["groups", "ko", "rep", "stats", "rules"].forEach(id => document.getElementById(id).hidden = id !== b.dataset.t);
}));

// ---- slaptažodis (tas pats kaip HLA lygoms) ----
const PASS_HLA = "1be0f832bf7db8b9679f1ced5d1eb5af03c0a8e7eafbb221ad56e47c19ef1b91"; // taurės slaptažodis
const sha = async s => Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)))).map(b => b.toString(16).padStart(2, "0")).join("");
let started = false;
function start() {
  if (started) return; started = true;
  document.getElementById("gate").hidden = true;
  load(); setInterval(load, 60000); loadExtra(); setInterval(loadExtra, 300000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
}
{
  document.getElementById("gate").hidden = false;
  document.getElementById("gatePass").focus();
  document.getElementById("gateForm").addEventListener("submit", async e => {
    e.preventDefault();
    const v = document.getElementById("gatePass").value.trim().toLowerCase();
    if (await sha(v) === PASS_HLA) start();
    else { document.getElementById("gateErr").textContent = "Neteisingas slaptažodis"; document.getElementById("gatePass").select(); }
  });
}
</script>
</body>
</html>
