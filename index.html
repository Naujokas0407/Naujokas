<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>draftlive · BasketNews Fantasy lygos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#0b0d12; --card:#12151c; --card-2:#161a22; --line:#262b36;
  --ink:#f2f4f8; --ink-2:#d3d8e2; --muted:#8b93a5; --faint:#5f6779;
  --cap:#ff7a1a; --cap-2:#ffa04d;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(60rem 30rem at 50% -10%,rgba(255,122,26,.16),transparent 60%)}
main{position:relative;max-width:760px;margin:0 auto;padding-inline:16px;padding-block:56px 64px;display:flex;flex-direction:column;gap:36px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px}
.emblem{width:120px;height:120px;filter:drop-shadow(0 12px 30px rgba(255,122,26,.25))}
.wm{font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1}
.wm b{color:var(--cap)}
.tag{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:rgba(18,21,28,.7)}
.tag i{width:7px;height:7px;border-radius:50%;background:var(--cap);box-shadow:0 0 0 4px rgba(255,122,26,.18)}
.lead{color:var(--muted);max-width:30rem;margin:0}
.h{font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 -22px}
.leagues{display:grid;gap:14px}
a.lg{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;padding:18px 18px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:inherit;text-decoration:none;transition:border-color .15s,transform .15s,background .15s}
a.lg:hover,a.lg:focus-visible{border-color:var(--cap);background:var(--card-2);transform:translateY(-1px);outline:none}
.ico{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:15px;letter-spacing:-.02em;color:#140a02;background:linear-gradient(135deg,var(--cap-2),#f25c05)}
.ico.h2h{background:linear-gradient(135deg,#e9edf5,#aab3c5)}
.nm{font-size:18px;font-weight:700;letter-spacing:-.01em}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;color:var(--muted);font-size:13px;margin-top:3px}
.pill{font-size:11px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--ink-2)}
.live{color:var(--cap);font-weight:600}
.me{margin-top:6px;font-size:13px;color:var(--ink-2)}
.me b{color:var(--cap)}
.go{font-size:22px;color:var(--faint)}
a.lg:hover .go{color:var(--cap)}
.foot{font-size:12px;color:var(--faint);text-align:center;line-height:1.6}
@media (max-width:480px){ .wm{font-size:32px} .emblem{width:96px;height:96px} a.lg{grid-template-columns:auto 1fr;gap:12px} .go{display:none} }
@media (prefers-reduced-motion:reduce){ a.lg{transition:none} }
</style>
</head>
<body>
<main>
  <header class="hero">
    <svg class="emblem" viewBox="0 0 120 120" aria-hidden="true">
      <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffa04d"/><stop offset="1" stop-color="#e8520a"/></linearGradient>
        <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1f29"/><stop offset="1" stop-color="#0e1117"/></linearGradient>
      </defs>
      <rect x="4" y="4" width="112" height="112" rx="30" fill="url(#g2)" stroke="#2b3140" stroke-width="2"/>
      <circle cx="60" cy="54" r="30" fill="url(#g1)"/>
      <g fill="none" stroke="#140a02" stroke-width="3" stroke-linecap="round">
        <circle cx="60" cy="54" r="30"/>
        <path d="M30 54h60M60 24v60"/>
        <path d="M39 33c9 7 9 35 0 42M81 33c-9 7-9 35 0 42"/>
      </g>
      <path d="M86 22l2.2 5 5 2.2-5 2.2-2.2 5-2.2-5-5-2.2 5-2.2z" fill="#fff"/>
      <rect x="22" y="88" width="76" height="20" rx="10" fill="#ff7a1a"/>
      <text x="60" y="102.5" text-anchor="middle" font-family="Geist,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="2" fill="#140a02">FANTASY</text>
    </svg>
    <div class="wm">draft<b>live</b></div>
    <span class="tag"><i></i>BasketNews Fantasy · Eurolyga</span>
    <p class="lead">Gyvi draft lygų rezultatai: rungtynių eiga ir statistika iš Eurolygos, fantasy taškai iš BasketNews Fantasy.</p>
  </header>

  <h2 class="h">Pasirinkite lygą</h2>
  <section class="leagues" id="leagues"></section>

  <p class="foot">Neoficialus puslapis. Duomenys atsinaujina automatiškai rungtynių metu.</p>
</main>
<script>
const LEAGUES = [
  { slug: "bn", title: "BN Fantasy 🏆", short: "BN", format: "classic" },
  { slug: "hla1", title: "HLA 1 Divizionas", short: "D1", format: "h2h" },
  { slug: "hla2", title: "HLA 2 Divizionas", short: "D2", format: "h2h" },
  { slug: "hla3", title: "HLA 3 Divizionas", short: "D3", format: "h2h" },
  { slug: "hla4", title: "HLA 4 Divizionas", short: "D4", format: "classic" }
];
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = n => String(Math.round(n * 100) / 100);
function card(L, d) {
  const fmt = L.format === "h2h" ? "H2H" : "Klasikinė";
  let meta = `<span class="pill">${fmt}</span>`, me = "";
  if (d) {
    const done = d.games.filter(g => g.status === "final").length, live = d.games.some(g => g.status === "live");
    meta += `<span>${d.round} turas</span><span>${live ? '<span class="live">● Vyksta</span>' : done === d.games.length && done ? "Turas baigtas" : done + "/" + d.games.length + " sužaista"}</span>`;
    const t = d.teams.find(x => d.myTeam && x.title.startsWith(d.myTeam));
    if (t) {
      if (L.format === "h2h" && d.matchups) {
        const m = d.matchups.find(x => x.a === t.title || x.b === t.title);
        if (m) { const opp = m.a === t.title ? m.b : m.a; const tt = n => { const x = d.teams.find(y => y.title === n); return x ? (x.official ?? x.total) : 0; };
          me = `${esc(t.title)} <b>${num(tt(t.title))}</b> : ${num(tt(opp))} ${esc(opp)}`; }
      } else {
        const order = [...d.teams].sort((a, b) => b.total - a.total);
        me = `${esc(t.title)} – <b>${order.indexOf(t) + 1} vieta</b>, ${num(t.total)} tšk.`;
      }
    }
  }
  return `<a class="lg" href="league.html?l=${encodeURIComponent(L.slug)}"><span class="ico ${L.format === "h2h" ? "h2h" : ""}">${esc(L.short)}</span><span><span class="nm">${esc(L.title)}</span><span class="meta">${meta}</span>${me ? `<div class="me">${me}</div>` : ""}</span><span class="go" aria-hidden="true">→</span></a>`;
}
const box = document.getElementById("leagues");
box.innerHTML = LEAGUES.map(L => card(L, null)).join("");
Promise.all(LEAGUES.map(L => fetch("data/" + L.slug + ".json?t=" + Date.now(), { cache: "no-store" }).then(r => r.ok ? r.json() : null).catch(() => null)))
  .then(ds => { box.innerHTML = LEAGUES.map((L, i) => card(L, ds[i])).join(""); });
</script>
</body>
</html>
