name: Atnaujinti lygos duomenis

on:
  schedule:
    - cron: "*/6 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # 1) Duomenų atnaujinimas – niekada nelaukia GitHub Pages leidimų, todėl negali užstrigti
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: data
      cancel-in-progress: false
    outputs:
      changed: ${{ steps.save.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Paimti duomenis (BasketNews + Eurolyga)
        run: node update.js

      - name: Issaugoti duomenis
        id: save
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add -A data
            git commit -m "Atnaujinti duomenys"
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash -X theirs && git push; then break; fi
              sleep $((i * 5))
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # 2) Svetainės paskelbimas – atskirai; jei užstrigtų, kitas paleidimas senąjį atšaukia
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
